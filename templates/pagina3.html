<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Firma de libro de visitas</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='estilos.css') }}"
    />
  </head>

  <body>
    <div class="tarjeta">
      <h1>Firma de libro de visitas</h1>

      <form action="/pagina3" method="POST">
        <label for="nombre">Tu nombre:</label>
        <br />

        <input type="text" id="nombre" name="nombre" required />

        <br /><br />

        <label for="mensaje">Mensaje:</label>
        <br />

        <textarea
          id="mensaje"
          name="mensaje"
          rows="5"
          cols="30"
          required
        ></textarea>

        <br /><br />

        <button type="submit">Enviar</button>
      </form>

      <br />

      <a href="/">Volver al inicio</a>
    </div>
  </body>
</html>
